<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: iOS のホーム画面 PWA でセーフエリアを扱う -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#111417" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<!-- iOS はホーム画面追加時にこれを使う。無いとスクリーンショットが使われる -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Coach" />
		<!--
			display 書体。欧文と数字にだけ効く（和文の Web フォントは数 MB あり
			PWA の初回起動を壊すので入れない。design.md の「書体」を参照）。
			落ちてもシステムのコンデンス体にフォールバックするだけで壊れない。
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
